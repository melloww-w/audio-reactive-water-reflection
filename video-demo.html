<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080a09" />
    <meta
      name="description"
      content="A 45-second demonstration of the audio-reactive Water, Listening artwork."
    />
    <title>Water, Listening — Video Demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080a09;
        color: #f2f3ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 10%, rgba(128, 143, 112, 0.2), transparent 42%),
          #080a09;
      }

      main {
        width: min(1120px, 100%);
        padding: clamp(20px, 5vw, 64px);
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 3vw, 2.25rem);
        font-weight: 520;
        letter-spacing: -0.025em;
      }

      p {
        margin: 6px 0 0;
        color: #aeb4aa;
        line-height: 1.5;
      }

      a {
        color: #f2f3ef;
        text-decoration: none;
        white-space: nowrap;
      }

      a:hover {
        text-decoration: underline;
      }

      video {
        display: block;
        width: 100%;
        max-height: min(72vh, 720px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        background: #000;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
      }

      .hint {
        margin-top: 14px;
        font-size: 0.88rem;
      }

      @media (max-width: 640px) {
        header {
          align-items: start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Water, Listening</h1>
          <p>Audio-reactive water reflection · 45-second demonstration</p>
        </div>
        <a href="./">Open interactive artwork →</a>
      </header>

      <video controls playsinline preload="metadata" poster="./assets/demo-preview.jpg">
        <source
          src="./demo-output/water-reflection-ripple-clean-audio-45s-ready.mp4"
          type="video/mp4"
        />
        Your browser does not support HTML video. You can
        <a href="./demo-output/water-reflection-ripple-clean-audio-45s-ready.mp4">download the MP4</a>.
      </video>

      <p class="hint">Press play, then use the speaker control to adjust or mute the soundtrack.</p>
    </main>
  </body>
</html>
